<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Voxel Turf</title>
  <desc id="desc">A stylized voxel city block used for the Voxel Turf supported game card.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#20244a"/>
      <stop offset="100%" stop-color="#0f1326"/>
    </linearGradient>
    <linearGradient id="road" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#27293d"/>
      <stop offset="100%" stop-color="#111522"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <circle cx="965" cy="130" r="58" fill="#f7d774" opacity="0.95"/>
  <g opacity="0.38" fill="#111522">
